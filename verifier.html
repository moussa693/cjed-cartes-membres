<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vérification membre CJED</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f7f7;
    margin: 0;
    padding: 20px;
}

.wrap {
    max-width: 560px;
    margin: 40px auto;
}

.card {
    background: white;
    border-radius: 24px;
    padding: 35px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

.logo {
    font-size: 42px;
    font-weight: 800;
    color: #102e5b;
}

.logo span {
    color: #087a2d;
}

h1 {
    font-size: 38px;
    margin: 35px 0 20px;
}

.ok {
    color: #087a2d;
    font-weight: 800;
    font-size: 20px;
}

.label {
    font-size: 12px;
    color: #667;
    font-weight: 700;
    margin-top: 16px;
}

.value {
    font-size: 17px;
    margin-top: 4px;
    color: #222;
}

.err {
    color: #a40000;
    font-weight: 700;
}

.loading {
    color: #555;
    font-size: 18px;
}
</style>
</head>

<body>

<div class="wrap">

    <div class="card">

        <div class="logo">
            CJ<span>ED</span>
        </div>

        <h1>Vérification d’adhésion</h1>

        <div id="result" class="loading">
            Vérification en cours...
        </div>

    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const idRecherche = params.get("id");

const box = document.getElementById("result");

if (!idRecherche) {

    box.innerHTML = `
        <p class="err">
            ❌ Aucun numéro de membre fourni.
        </p>
    `;

} else {

fetch("./members.json?cache=" + Date.now())

    .then(response => {

        if (!response.ok) {
            throw new Error("Impossible de charger members.json");
        }

        return response.json();

    })

    .then(members => {

        const membre = members.find(m => {
    const identifiant = String(m.id || "").trim().toUpperCase();
    const recherche = String(idRecherche || "").trim().toUpperCase();

    return identifiant === recherche;
});

        if (!membre) {

            box.innerHTML = `
                <p class="err">
                    ❌ MEMBRE INTROUVABLE
                </p>

                <div class="label">
                    Numéro recherché
                </div>

                <div class="value">
                    ${idRecherche}
                </div>
            `;

            return;
        }

        const identifiant =
            membre.id ||
            membre.identifiant ||
            membre.numero ||
            membre.numero_membre;

        const nom =
            membre.nom || "";

        const prenom =
            membre.prenom || "";

        const fonction =
            membre.fonction || "Membre";

        const cellule =
            membre.cellule || "-";

        const telephone =
            membre.telephone || "-";

        const email =
            membre.email || "-";

        const adresse =
            membre.adresse || "-";

        const statut =
            membre.statut || "Membre actif";

        const expiration =
            membre.expiration || "-";

        box.innerHTML = `

            <p class="ok">
                ✅ MEMBRE CJED VÉRIFIÉ
            </p>

            <div class="label">
                Nom complet
            </div>

            <div class="value">
                ${prenom} ${nom}
            </div>


            <div class="label">
                N° membre
            </div>

            <div class="value">
                ${identifiant}
            </div>


            <div class="label">
                Fonction
            </div>

            <div class="value">
                ${fonction}
            </div>


            <div class="label">
                Cellule
            </div>

            <div class="value">
                ${cellule}
            </div>


            <div class="label">
                Téléphone
            </div>

            <div class="value">
                ${telephone}
            </div>


            <div class="label">
                Email
            </div>

            <div class="value">
                ${email}
            </div>


            <div class="label">
                Adresse
            </div>

            <div class="value">
                ${adresse}
            </div>


            <div class="label">
                Statut
            </div>

            <div class="value">
                ${statut}
            </div>


            <div class="label">
                Validité
            </div>

            <div class="value">
                ${expiration}
            </div>

        `;

    })

    .catch(error => {

        console.error(error);

        box.innerHTML = `

            <p class="err">
                ❌ ERREUR DE VÉRIFICATION
            </p>

            <p>
                Impossible de charger les informations
                des membres CJED.
            </p>

        `;

    });

}

</script>

</body>
</html>
