<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CJED — Cartes membres</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7f5;margin:0;color:#10245b}
header{background:#10245b;color:#fff;padding:22px;text-align:center} header b{color:#27a844}
main{max-width:900px;margin:30px auto;padding:0 18px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 4px 18px #0001;margin-bottom:20px}
h1{margin:0}.btn{display:inline-block;background:#148a35;color:white;padding:12px 18px;border-radius:8px;text-decoration:none;border:0;cursor:pointer}
table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}
</style></head>
<body>
<header><h1>CJED</h1><div>Collectif des Jeunes Engagés pour le Développement</div></header>
<main><div class="card">
<h2>Cartes membres numériques</h2>
<p>Chaque membre possède un identifiant unique et une page de vérification.</p>
<table><thead><tr><th>N° membre</th><th>Nom</th><th>Fonction</th><th>Statut</th><th></th></tr></thead>
<tbody id="list"></tbody></table></div></main>
<script>
fetch('members.json').then(r=>r.json()).then(ms=>{
 const base=location.href.replace(/index\.html.*$/,'');
 document.getElementById('list').innerHTML=ms.map(m=>`
 <tr><td>${m.id}</td><td>${m.prenom} ${m.nom}</td><td>${m.fonction}</td><td>${m.statut}</td>
 <td><a class="btn" href="verifier.html?id=${encodeURIComponent(m.id)}">Vérifier</a></td></tr>`).join('');
});
</script>
</body></html>
